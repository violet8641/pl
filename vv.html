<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: #f1f5f9;
        color: #334155;
    }
    .container {
        max-width: 950px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 4px 12px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 20px; color: #1e293b; }
    .form {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        padding: 15px;
        border-radius: 6px;
        display: grid;
        grid-template-columns: 2fr 1.5fr 1fr 2fr;
        gap: 12px;
        align-items: end;
        margin-bottom: 20px;
    }
    label {
        display: block;
        font-size: 12px;
        font-weight: bold;
        margin-bottom: 5px;
        text-transform: uppercase;
    }
    input {
        width: 100%;
        padding: 9px;
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        font-size: 14px;
    }
    input[type="file"] { padding: 6px; }
    .file-name {
        font-size: 12px;
        margin-top: 5px;
        color: #64748b;
        word-break: break-all;
    }
    button {
        border: 0;
        border-radius: 4px;
        padding: 9px 14px;
        font-weight: bold;
        cursor: pointer;
    }
    .add { background: #10b981; color: white; }
    .export { background: #2563eb; color: white; }
    .clear { background: #64748b; color: white; }
    .delete { background: #ef4444; color: white; padding: 6px 10px; }
    .edit { background: #f59e0b; color: white; padding: 6px 10px; margin-right: 5px; }
    .actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-bottom: 15px;
    }
    table {
        width: 100%;
        border-collapse: collapse;
    }
    th, td {
        padding: 9px;
        border-bottom: 1px solid #e2e8f0;
        text-align: left;
    }
    th {
        background: #1e293b;
        color: white;
        font-size: 13px;
    }
    .thumb {
        width: 45px;
        height: 45px;
        object-fit: contain;
        border: 1px solid #e2e8f0;
        border-radius: 4px;
        background: white;
    }
    .empty {
        text-align: center;
        color: #64748b;
        padding: 25px;
    }
    @media (max-width: 750px) {
        .form { grid-template-columns: 1fr 1fr; }
        .actions { justify-content: stretch; }
        .actions button { flex: 1; }
        table { font-size: 13px; }
    }
    @media (max-width: 500px) {
        .form { grid-template-columns: 1fr; }
        body { padding: 10px; }
        .container { padding: 15px; }
        th, td { padding: 6px; }
    }
</style>
</head>
<body>

<div class="container">
    <h1>Plumbing</h1>

    <div class="form">
        <div>
            <label for="itemName">Item Name</label>
            <input id="itemName" type="text" placeholder="Enter item name">
        </div>

        <div>
            <label for="brand">Brand</label>
            <input id="brand" type="text" placeholder="Enter brand">
        </div>

        <div>
            <label for="quantity">Quantity</label>
            <input id="quantity" type="number" min="0" value="1">
        </div>

        <div>
            <label for="image">Item Image</label>
            <input id="image" type="file" accept="image/*">
            <div id="fileName" class="file-name">No image selected</div>
        </div>

        <div>
            <button id="saveButton" class="add" onclick="saveItem()">Add Item</button>
        </div>
    </div>

    <div class="actions">
        <button class="clear" onclick="clearDatabase()">Clear All</button>
        <button class="export" onclick="exportJSON()">Export file</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Image</th>
                <th>Item Name</th>
                <th>Image Filename</th>
                <th>Quantity</th>
                <th>Brand</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
let database = JSON.parse(localStorage.getItem("item_database") || "[]");
let editIndex = -1;

const imageInput = document.getElementById("image");
const fileName = document.getElementById("fileName");

imageInput.addEventListener("change", () => {
    const file = imageInput.files[0];
    fileName.textContent = file ? file.name : "No image selected";
});

function saveDatabase() {
    localStorage.setItem("item_database", JSON.stringify(database));
}

function saveItem() {
    const name = document.getElementById("itemName").value.trim();
    const brand = document.getElementById("brand").value.trim();
    const quantity = Number(document.getElementById("quantity").value);
    const file = imageInput.files[0];

    if (!name) {
        alert("Please enter an item name.");
        return;
    }

    if (!file && editIndex === -1) {
        alert("Please choose an image.");
        return;
    }

    if (editIndex === -1) {
        database.push({
            item_name: name,
            item_image_filename: file.name,
            quantity: quantity,
            brand: brand
        });
    } else {
        database[editIndex].item_name = name;
        database[editIndex].quantity = quantity;
        database[editIndex].brand = brand;

        // Keep the existing filename unless a new image is selected.
        if (file) {
            database[editIndex].item_image_filename = file.name;
        }
    }

    saveDatabase();
    resetForm();
    render();
}

function editItem(index) {
    const item = database[index];

    document.getElementById("itemName").value = item.item_name;
    document.getElementById("brand").value = item.brand;
    document.getElementById("quantity").value = item.quantity;

    editIndex = index;
    document.getElementById("saveButton").textContent = "Update Item";
    fileName.textContent = item.item_image_filename || "Existing image";
}

function deleteItem(index) {
    if (!confirm("Delete this item?")) return;

    database.splice(index, 1);
    saveDatabase();
    render();
}

function resetForm() {
    document.getElementById("itemName").value = "";
    document.getElementById("brand").value = "";
    document.getElementById("quantity").value = "1";
    imageInput.value = "";
    fileName.textContent = "No image selected";
    editIndex = -1;
    document.getElementById("saveButton").textContent = "Add Item";
}

function clearDatabase() {
    if (!database.length) return;

    if (confirm("Delete all items from the database?")) {
        database = [];
        saveDatabase();
        resetForm();
        render();
    }
}

function exportJSON() {
    if (!database.length) {
        alert("There is no data to export.");
        return;
    }

    const json = JSON.stringify(database, null, 4);
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "items.json";
    a.click();

    URL.revokeObjectURL(url);
}

function render() {
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    if (!database.length) {
        tbody.innerHTML = `
            <tr>
                <td colspan="6" class="empty">No items added yet.</td>
            </tr>
        `;
        return;
    }

    database.forEach((item, index) => {
        const row = document.createElement("tr");

        // The selected image is not embedded in the JSON.
        // Browsers cannot expose the local file path, so the database stores
        // only the filename as requested.
        row.innerHTML = `
            <td><div class="thumb"></div></td>
            <td>${escapeHTML(item.item_name)}</td>
            <td>${escapeHTML(item.item_image_filename)}</td>
            <td>${item.quantity}</td>
            <td>${escapeHTML(item.brand)}</td>
            <td>
                <button class="edit" onclick="editItem(${index})">Edit</button>
                <button class="delete" onclick="deleteItem(${index})">Delete</button>
            </td>
        `;

        tbody.appendChild(row);
    });
}

function escapeHTML(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

render();
</script>

</body>
</html>
