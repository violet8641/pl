<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plumbing Inventory (High Performance)</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: #f1f5f9;
        color: #334155;
    }
    .container {
        max-width: 950px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 4px 12px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 20px; color: #1e293b; }
    .form {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        padding: 15px;
        border-radius: 6px;
        display: grid;
        grid-template-columns: 2fr 1.5fr 1fr 2fr auto;
        gap: 12px;
        align-items: end;
        margin-bottom: 20px;
    }
    label {
        display: block;
        font-size: 12px;
        font-weight: bold;
        margin-bottom: 5px;
        text-transform: uppercase;
    }
    input {
        width: 100%;
        padding: 9px;
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        font-size: 14px;
    }
    input[type="file"] { padding: 6px; }
    .file-name {
        font-size: 12px;
        margin-top: 5px;
        color: #64748b;
        word-break: break-all;
    }
    button {
        border: 0;
        border-radius: 4px;
        padding: 9px 14px;
        font-weight: bold;
        cursor: pointer;
    }
    .add { background: #10b981; color: white; height: 38px; }
    .export { background: #2563eb; color: white; }
    .clear { background: #64748b; color: white; }
    .delete { background: #ef4444; color: white; padding: 6px 10px; }
    .edit { background: #f59e0b; color: white; padding: 6px 10px; margin-right: 5px; }
    .actions {
        display: flex;
        gap: 8px;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
    }
    .btn-group { display: flex; gap: 8px; }

    /* Saved Banner */
    .saved-preview-card {
        background: #ecfdf5;
        border: 1px solid #a7f3d0;
        border-radius: 6px;
        padding: 12px 16px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 14px;
    }
    .saved-preview-thumb {
        width: 50px;
        height: 50px;
        object-fit: cover;
        border-radius: 4px;
        border: 1px solid #6ee7b7;
        background: #fff;
    }
    .saved-preview-title { font-weight: bold; color: #065f46; margin: 0 0 2px; }
    .saved-preview-meta { font-size: 12px; color: #047857; margin: 0; }

    table { width: 100%; border-collapse: collapse; }
    th, td {
        padding: 8px 10px;
        border-bottom: 1px solid #e2e8f0;
        text-align: left;
        vertical-align: middle;
    }
    th { background: #1e293b; color: white; font-size: 13px; }
    .thumb {
        width: 44px;
        height: 44px;
        object-fit: cover;
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        background: #f8fafc;
        display: block;
    }
    .no-thumb {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        color: #94a3b8;
    }
    .empty { text-align: center; color: #64748b; padding: 25px; }

    /* Pagination controls */
    .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin-top: 15px;
    }
    .pagination button {
        background: #e2e8f0;
        color: #1e293b;
        padding: 6px 12px;
    }
    .pagination button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }
    .page-info { font-size: 13px; font-weight: bold; color: #64748b; }
</style>
</head>
<body>

<div class="container">
    <h3>എല്ലാം add ചെയ്തു കഴിയുമ്പോൾ ഈ സൈറ്റിൽ ഉള്ള export file എന്ന നീല ബട്ടൺ ൽ ക്ലിക്ക് ചെയ്യണം. 

അപ്പൊ ഒരു file ഡൌൺലോഡ് ആവും. 

ആ ഫയൽ എനിക്ക് അയച്ചു തരണം.</h3>

    <div class="form">
        <div>
            <label for="itemName">Item Name</label>
            <input id="itemName" type="text" placeholder="Enter item name">
        </div>

        <div>
            <label for="brand">Brand</label>
            <input id="brand" type="text" placeholder="Enter brand">
        </div>

        <div>
            <label for="quantity">Quantity</label>
            <input id="quantity" type="number" min="0" value="1">
        </div>

        <div>
            <label for="image">Item Image</label>
            <input id="image" type="file" accept="image/*">
            <div id="fileName" class="file-name">No image selected</div>
        </div>

        <div>
            <button id="saveButton" class="add" onclick="saveItem()">Add Item</button>
        </div>
    </div>

    <div id="savedPreviewContainer"></div>

    <div class="actions">
        <span id="totalCount" style="font-size: 13px; font-weight: bold; color: #475569;">Total Items: 0</span>
        <div class="btn-group">
            <button class="clear" onclick="clearDatabase()">Clear All</button>
            <button class="export" onclick="exportJSON()">Export file</button>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Image</th>
                <th>Item Name</th>
                <th>Image Filename</th>
                <th>Quantity</th>
                <th>Brand</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <div class="pagination">
        <button id="prevBtn" onclick="changePage(-1)">Prev</button>
        <span id="pageIndicator" class="page-info">Page 1 of 1</span>
        <button id="nextBtn" onclick="changePage(1)">Next</button>
    </div>
</div>

<script>
const DB_NAME = "InventoryDB";
const DB_VERSION = 1;
const STORE_NAME = "items";

let db = null;
let editingId = null;
let cachedItems = [];
let currentPage = 1;
const PAGE_SIZE = 25; // Keeps DOM node count light

const imageInput = document.getElementById("image");
const fileName = document.getElementById("fileName");

imageInput.addEventListener("change", () => {
    const file = imageInput.files[0];
    fileName.textContent = file ? file.name : "No image selected";
});

// 1. Initialize IndexedDB
function initDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
            const database = e.target.result;
            if (!database.objectStoreNames.contains(STORE_NAME)) {
                database.createObjectStore(STORE_NAME, { keyPath: "id", autoIncrement: true });
            }
        };
        request.onsuccess = (e) => {
            db = e.target.result;
            resolve();
        };
        request.onerror = (e) => reject(e);
    });
}

// 2. Client-side canvas compression: Resizes image to ~100x100 thumbnail (~4KB)
function compressImage(file, maxWidth = 120, maxHeight = 120, quality = 0.7) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
            const img = new Image();
            img.src = e.target.result;
            img.onload = () => {
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                } else {
                    if (height > maxHeight) {
                        width = Math.round((width * maxHeight) / height);
                        height = maxHeight;
                    }
                }

                const canvas = document.createElement("canvas");
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, width, height);

                resolve(canvas.toDataURL("image/jpeg", quality));
            };
        };
    });
}

// 3. Database operations
async function getAllItems() {
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result.reverse()); // Newest first
        req.onerror = () => reject(req.error);
    });
}

async function saveItem() {
    const name = document.getElementById("itemName").value.trim();
    const brand = document.getElementById("brand").value.trim();
    const quantity = Number(document.getElementById("quantity").value);
    const file = imageInput.files[0];

    if (!name) {
        alert("Please enter an item name.");
        return;
    }

    if (!file && editingId === null) {
        alert("Please choose an image.");
        return;
    }

    let compressedData = null;
    if (file) {
        compressedData = await compressImage(file);
    }

    const tx = db.transaction(STORE_NAME, "readwrite");
    const store = tx.objectStore(STORE_NAME);

    if (editingId === null) {
        const record = {
            item_name: name,
            brand: brand,
            quantity: quantity,
            item_image_filename: file.name,
            item_image_data: compressedData
        };
        store.add(record);
        showSavedBanner(record);
    } else {
        const req = store.get(editingId);
        req.onsuccess = () => {
            const data = req.result;
            data.item_name = name;
            data.brand = brand;
            data.quantity = quantity;
            if (file) {
                data.item_image_filename = file.name;
                data.item_image_data = compressedData;
            }
            store.put(data);
            showSavedBanner(data);
        };
    }

    tx.oncomplete = async () => {
        resetForm();
        await refreshTable();
    };
}

async function deleteItem(id) {
    if (!confirm("Delete this item?")) return;
    const tx = db.transaction(STORE_NAME, "readwrite");
    tx.objectStore(STORE_NAME).delete(id);
    tx.oncomplete = async () => {
        await refreshTable();
    };
}

function editItem(id) {
    const item = cachedItems.find(i => i.id === id);
    if (!item) return;

    document.getElementById("itemName").value = item.item_name;
    document.getElementById("brand").value = item.brand;
    document.getElementById("quantity").value = item.quantity;
    fileName.textContent = item.item_image_filename || "Existing image";

    editingId = id;
    document.getElementById("saveButton").textContent = "Update Item";
    window.scrollTo({ top: 0, behavior: "smooth" });
}

function clearDatabase() {
    if (!confirm("Delete all 1000+ items? This cannot be undone.")) return;
    const tx = db.transaction(STORE_NAME, "readwrite");
    tx.objectStore(STORE_NAME).clear();
    tx.oncomplete = async () => {
        document.getElementById("savedPreviewContainer").innerHTML = "";
        await refreshTable();
    };
}

// 4. Lightweight Rendering & Pagination
async function refreshTable() {
    cachedItems = await getAllItems();
    document.getElementById("totalCount").textContent = `Total Items: ${cachedItems.length}`;
    renderPage();
}

function renderPage() {
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    const totalPages = Math.ceil(cachedItems.length / PAGE_SIZE) || 1;
    if (currentPage > totalPages) currentPage = totalPages;

    const start = (currentPage - 1) * PAGE_SIZE;
    const end = start + PAGE_SIZE;
    const pageSlice = cachedItems.slice(start, end);

    if (pageSlice.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="empty">No items added yet.</td></tr>`;
        updatePaginationControls(totalPages);
        return;
    }

    // Build batch HTML to avoid layout thrashing
    const fragment = document.createDocumentFragment();
    pageSlice.forEach(item => {
        const row = document.createElement("tr");
        const imageCell = item.item_image_data
            ? `<img src="${item.item_image_data}" alt="" class="thumb" loading="lazy">`
            : `<div class="thumb no-thumb">No Image</div>`;

        row.innerHTML = `
            <td>${imageCell}</td>
            <td>${escapeHTML(item.item_name)}</td>
            <td>${escapeHTML(item.item_image_filename)}</td>
            <td>${item.quantity}</td>
            <td>${escapeHTML(item.brand)}</td>
            <td>
                <button class="edit" onclick="editItem(${item.id})">Edit</button>
                <button class="delete" onclick="deleteItem(${item.id})">Delete</button>
            </td>
        `;
        fragment.appendChild(row);
    });

    tbody.appendChild(fragment);
    updatePaginationControls(totalPages);
}

function changePage(step) {
    currentPage += step;
    renderPage();
}

function updatePaginationControls(totalPages) {
    document.getElementById("pageIndicator").textContent = `Page ${currentPage} of ${totalPages}`;
    document.getElementById("prevBtn").disabled = currentPage <= 1;
    document.getElementById("nextBtn").disabled = currentPage >= totalPages;
}

function showSavedBanner(item) {
    const container = document.getElementById("savedPreviewContainer");
    const img = item.item_image_data
        ? `<img src="${item.item_image_data}" class="saved-preview-thumb">`
        : `<div class="saved-preview-thumb no-thumb">No Img</div>`;

    container.innerHTML = `
        <div class="saved-preview-card">
            ${img}
            <div>
                <p class="saved-preview-title">✓ Saved: ${escapeHTML(item.item_name)}</p>
                <p class="saved-preview-meta">Brand: ${escapeHTML(item.brand || "—")} | Qty: ${item.quantity}</p>
            </div>
        </div>
    `;
}

function resetForm() {
    document.getElementById("itemName").value = "";
    document.getElementById("brand").value = "";
    document.getElementById("quantity").value = "1";
    imageInput.value = "";
    fileName.textContent = "No image selected";
    editingId = null;
    document.getElementById("saveButton").textContent = "Add Item";
}

function exportJSON() {
    if (!cachedItems.length) {
        alert("No items to export.");
        return;
    }
    // Omit image data from download to keep the JSON light
    const cleanData = cachedItems.map(({ item_image_data, ...rest }) => rest);
    const json = JSON.stringify(cleanData, null, 2);
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "inventory.json";
    a.click();
    URL.revokeObjectURL(url);
}

function escapeHTML(str) {
    return String(str ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

window.addEventListener("DOMContentLoaded", async () => {
    await initDB();
    await refreshTable();
});
</script>
</body>
</html>
